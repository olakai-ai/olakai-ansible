---
name: lint

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: "ansible-core ${{ matrix.ansible_core }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Declared floor (meta/main.yml min_ansible_version). ansible-core
          # 2.15 needs Python 3.9-3.11 on the control node. Current
          # ansible-lint releases need a newer ansible-core, so this entry
          # runs yamllint and the syntax checks only.
          - ansible_core: "2.15.13"
            python: "3.11"
            ansible_lint: ""
          # Current release, with ansible-lint.
          - ansible_core: "2.19.12"
            python: "3.12"
            ansible_lint: "26.8.0"
    env:
      YAMLLINT_VERSION: "1.38.0"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"

      - name: Install ansible-core and yamllint
        run: >-
          python -m pip install --upgrade pip
          "ansible-core==${{ matrix.ansible_core }}"
          "yamllint==${YAMLLINT_VERSION}"

      - name: Install ansible-lint
        if: matrix.ansible_lint != ''
        run: python -m pip install "ansible-lint==${{ matrix.ansible_lint }}"

      - name: Install required collections
        # --no-cache works around a galaxy response-cache bug in current
        # ansible-core ("Missing expected 'results' in ansible-galaxy cache").
        run: ansible-galaxy collection install --no-cache -r requirements.yml

      - name: yamllint
        run: yamllint --strict .

      - name: ansible-lint
        if: matrix.ansible_lint != ''
        run: ansible-lint --offline

      - name: Syntax check the playbooks
        run: |
          ansible-playbook --syntax-check -i inventory.example.ini install.yml
          ansible-playbook --syntax-check -i inventory.example.ini upgrade.yml
