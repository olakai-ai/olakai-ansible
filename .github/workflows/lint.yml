---
name: lint

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: ansible-lint + yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-core, ansible-lint and yamllint
        run: python -m pip install --upgrade pip ansible-core ansible-lint yamllint

      - name: Install required collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint --strict .

      - name: ansible-lint
        run: ansible-lint --offline

      - name: Syntax check the playbooks
        run: |
          ansible-playbook --syntax-check -i inventory.example.ini install.yml
          ansible-playbook --syntax-check -i inventory.example.ini upgrade.yml
