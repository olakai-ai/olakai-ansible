# Copy to inventory.ini and edit.
# One host per Olakai deployment. The playbooks target the "olakai" group.
[olakai]
olakai-01 ansible_host=203.0.113.10 ansible_user=opc

# Notes
# - ansible_user must be able to sudo to root without a password, or pass
#   --ask-become-pass on the command line.
# - The host needs python3 (Ansible and get.sh both require it).
