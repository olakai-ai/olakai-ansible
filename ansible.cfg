# Control-node settings for this repository. ansible-playbook reads the
# ansible.cfg of the current directory (never from a world-writable
# directory), so run the playbooks from the repository root, or copy this
# section into your own configuration.
[ssh_connection]
# upgrade.yml becomes the unprivileged service user under rootless Podman
# (become_user: <olakai_service_user>). Without pipelining, Ansible writes
# the module to a temporary file as the connection user and hands it to the
# service user with setfacl (package acl), which Debian and Ubuntu do not
# install by default. With pipelining the module travels over the SSH
# channel and no file changes hands. Needs sudoers without `requiretty`,
# the default on current distributions. ANSIBLE_PIPELINING=true in the
# environment does the same.
pipelining = True
