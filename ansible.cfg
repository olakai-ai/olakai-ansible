# Control-node settings for this repository. ansible-playbook uses the FIRST
# ansible.cfg it finds (ANSIBLE_CONFIG, then ./ansible.cfg, then
# ~/.ansible.cfg, then /etc/ansible/ansible.cfg) and does not merge them: run
# from the repository root and this file replaces your ~/.ansible.cfg
# entirely. If you have your own configuration, keep it and set
# ANSIBLE_PIPELINING=true in the environment instead. (A world-writable
# directory's ansible.cfg is ignored.)
[ssh_connection]
# upgrade.yml becomes the unprivileged service user under rootless Podman
# (become_user: <olakai_service_user>). Without pipelining, Ansible writes
# the module to a temporary file as the connection user and hands it to the
# service user with setfacl (package acl), which Debian and Ubuntu do not
# install by default. With pipelining the module travels over the SSH
# channel and no file changes hands. Needs sudoers without `requiretty`,
# the default on current distributions.
pipelining = True
