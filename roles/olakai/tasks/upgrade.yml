---
# Upgrade an existing install with the bundle's own upgrade.sh.
# No license key is involved: upgrade.sh authenticates to the relay with the
# deployment bearer stored in <olakai_install_dir>/.env.
#
# upgrade.sh already does: sha256 + cosign verification, destructive-migration
# preflight, pre-upgrade backup, overlay, pull, migrate gate, health gate and
# automatic rollback. The role only calls it and reads its verdict.

- name: Check for an existing install (.env)
  ansible.builtin.stat:
    path: "{{ olakai_install_dir }}/.env"
  register: olakai_env_stat

- name: Assert the install exists
  ansible.builtin.assert:
    that:
      - olakai_env_stat.stat.exists
    fail_msg: >-
      {{ olakai_install_dir }}/.env not found. Nothing to upgrade here.
      Run install.yml first or fix olakai_install_dir.

- name: Check for upgrade.sh
  ansible.builtin.stat:
    path: "{{ olakai_install_dir }}/upgrade.sh"
  register: olakai_upgrade_sh_stat

- name: Assert upgrade.sh exists
  ansible.builtin.assert:
    that:
      - olakai_upgrade_sh_stat.stat.exists
    fail_msg: >-
      {{ olakai_install_dir }}/upgrade.sh not found. The installed bundle is
      too old for unattended upgrades. Contact support@olakai.ai.

- name: Build the upgrade.sh argument list
  ansible.builtin.set_fact:
    olakai_upgrade_sh_args: >-
      {{
        [
          '--yes',
          '--install-dir=' ~ olakai_install_dir,
          '--to=' ~ (olakai_version if olakai_version else 'latest')
        ]
        + (['--accept-data-loss'] if olakai_accept_data_loss | bool else [])
        + (['--skip-verify'] if olakai_skip_verify | bool else [])
        + olakai_upgrade_sh_extra_args
      }}
    # Under rootless Podman the compose state belongs to the service user, so
    # upgrade.sh must run as that user. Under Docker it runs as root.
    olakai_upgrade_user: >-
      {{ olakai_service_user if olakai_runtime_resolved == 'podman-rootless' else 'root' }}

# No secret is involved here: upgrade.sh reads the deployment bearer from
# .env itself and does not echo it, so its output can be shown.
- name: Run upgrade.sh  # noqa: no-changed-when
  ansible.builtin.command:
    argv: "{{ ['bash', olakai_install_dir ~ '/upgrade.sh'] + olakai_upgrade_sh_args }}"
    chdir: "{{ olakai_install_dir }}"
  become: true
  become_user: "{{ olakai_upgrade_user }}"
  register: olakai_upgrade_result
  changed_when: "'UPGRADE COMPLETE' in (olakai_upgrade_result.stdout | default(''))"
  failed_when: false

# The command module skips itself in check mode (--check). The registered
# result then has skipped: true and no stdout, stderr, or rc, so the tasks
# below only run when upgrade.sh actually ran.
- name: Report that upgrade.sh was not run (check mode)
  ansible.builtin.debug:
    msg: "upgrade.sh was not run (check mode). Nothing changed."
  when: olakai_upgrade_result is skipped

- name: Show the last lines of upgrade.sh output
  ansible.builtin.debug:
    msg: "{{ ((olakai_upgrade_result.stdout_lines | default([])) + (olakai_upgrade_result.stderr_lines | default([])))[-40:] }}"
  when: olakai_upgrade_result is not skipped

- name: Fail when upgrade.sh did not succeed
  ansible.builtin.fail:
    msg: >-
      upgrade.sh exited with rc={{ olakai_upgrade_result.rc | default('?') }}
      {{ '(UPGRADE FAILED reported)' if 'UPGRADE FAILED' in
         ((olakai_upgrade_result.stdout | default('')) ~ (olakai_upgrade_result.stderr | default(''))) else '' }}.
      upgrade.sh rolls back to the previous version on its own when the
      migrate or health gate fails. Read the output above; for a destructive
      migration set olakai_accept_data_loss: true only after you have read
      what it destroys.
  when:
    - olakai_upgrade_result is not skipped
    - >-
      olakai_upgrade_result.rc | default(0) != 0
      or 'UPGRADE FAILED' in ((olakai_upgrade_result.stdout | default('')) ~ (olakai_upgrade_result.stderr | default('')))
