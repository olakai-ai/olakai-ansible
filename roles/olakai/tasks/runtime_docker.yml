---
# Docker runtime: make sure Docker Engine + Compose v2 are present and running.
# get.sh checks this again and can install Docker itself with
# --auto-install-docker. The role does it first so the step is idempotent and
# visible in the Ansible output.

- name: Check whether the docker binary exists
  ansible.builtin.stat:
    path: "{{ olakai_docker_binary_path }}"
  register: olakai_docker_stat

- name: Fail when Docker is missing and auto-install is disabled
  ansible.builtin.fail:
    msg: >-
      Docker is not installed and olakai_auto_install_docker is false.
      Install Docker Engine 24+ with Compose v2 from Docker's signed package
      repositories (https://docs.docker.com/engine/install/) and re-run, or
      set olakai_auto_install_docker: true.
  when:
    - not olakai_docker_stat.stat.exists
    - not olakai_auto_install_docker | bool

# Oracle Linux: get.docker.com rejects ID=ol ("Unsupported distribution").
# The role does not run it there. get.sh (with --auto-install-docker, which
# install.yml passes when olakai_auto_install_docker is true) installs Docker
# CE from Docker's CentOS package repository over HTTPS instead. The service
# and compose checks below are skipped in that case; get.sh repeats them.
- name: Record whether the Docker install is delegated to get.sh (Oracle Linux)
  ansible.builtin.set_fact:
    olakai_docker_delegated: >-
      {{ not olakai_docker_stat.stat.exists and ansible_distribution == 'OracleLinux' }}

- name: Delegate the Docker install to get.sh on Oracle Linux
  ansible.builtin.debug:
    msg: >-
      Docker is not installed. get.docker.com rejects Oracle Linux (ID=ol), so
      the role leaves the install to get.sh: it runs with --auto-install-docker
      and installs Docker CE from Docker's CentOS package repository
      (https://download.docker.com/linux/centos/docker-ce.repo).
  when: olakai_docker_delegated | bool

# get.docker.com does not support Amazon Linux; use the distro package there.
- name: Install Docker from the distro package (Amazon Linux)
  ansible.builtin.dnf:
    name: docker
    state: present
  when:
    - not olakai_docker_stat.stat.exists
    - ansible_distribution == 'Amazon'

- name: Install Docker with the get.docker.com script
  when:
    - not olakai_docker_stat.stat.exists
    - ansible_distribution not in ['Amazon', 'OracleLinux']
  block:
    # Same warning get.sh prints before it runs this script itself.
    - name: Warn about the get.docker.com trust boundary
      ansible.builtin.debug:
        msg: >-
          WARNING: installing Docker with the get.docker.com script. The upstream
          installer script is NOT signature-verified, so this extends the
          install's trust boundary to docker.com's HTTPS-served script. For a
          conservative install set olakai_auto_install_docker: false and install
          Docker Engine 24+ with Compose v2 from Docker's signed package
          repositories (https://docs.docker.com/engine/install/) before you run
          this playbook.

    # mkdtemp: mode 0700, owner root, so no other user on the host can swap
    # the script between download and run.
    - name: Create a root-only temporary directory for the get.docker.com script
      ansible.builtin.tempfile:
        state: directory
        prefix: olakai-get-docker.
      register: olakai_docker_get_tmpdir

    - name: Download the get.docker.com script
      ansible.builtin.get_url:
        url: https://get.docker.com
        dest: "{{ olakai_docker_get_tmpdir.path }}/get-docker.sh"
        mode: "0700"

    - name: Run the get.docker.com script
      ansible.builtin.command:
        cmd: "sh {{ olakai_docker_get_tmpdir.path }}/get-docker.sh"
        creates: "{{ olakai_docker_binary_path }}"
  always:
    - name: Remove the temporary directory with the get.docker.com script
      ansible.builtin.file:
        path: "{{ olakai_docker_get_tmpdir.path }}"
        state: absent
      when: olakai_docker_get_tmpdir.path is defined

# Amazon Linux ships no compose plugin. Install the standalone binary as a CLI
# plugin so `docker compose` works.
- name: Install the Docker Compose CLI plugin (Amazon Linux)
  when: ansible_distribution == 'Amazon'
  block:
    - name: Create the Docker CLI plugin directory
      ansible.builtin.file:
        path: "{{ olakai_compose_plugin_path | dirname }}"
        state: directory
        mode: "0755"

    - name: Download the Docker Compose CLI plugin
      ansible.builtin.get_url:
        url: "{{ olakai_compose_url }}"
        dest: "{{ olakai_compose_plugin_path }}"
        checksum: "sha256:{{ olakai_compose_sha256[ansible_architecture] }}"
        mode: "0755"

- name: Enable and start the docker service
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  when: not olakai_docker_delegated | bool

- name: Check that docker compose v2 works
  ansible.builtin.command:
    cmd: docker compose version
  register: olakai_compose_check
  changed_when: false
  failed_when: false
  when: not olakai_docker_delegated | bool

- name: Assert docker compose v2 works
  ansible.builtin.assert:
    that:
      - olakai_compose_check.rc == 0
    fail_msg: >-
      `docker compose version` failed. Install the docker-compose-plugin
      package (Compose v2) and re-run.
  when: not olakai_docker_delegated | bool
