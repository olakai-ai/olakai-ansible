---
# Rootless Podman runtime: preflight only.
#
# get.sh --runtime=podman-rootless (2026.09.03.2 or later) does the whole OS
# preparation itself, as root, before it hands the bundle to the service
# user: Podman 5 + podman-docker from the distro repositories, the
# docker-compose provider pinned by SHA256 and registered in
# /etc/containers/containers.conf.d, the service user with a free
# 65536-wide subordinate id range (checked against every entry in
# /etc/subuid and /etc/subgid), systemd linger, the sysctl for ports 80 and
# 443, the user-scope podman.socket and podman-restart.service, and the
# hand-off of the install directory (owner, mode 0750, .olakai-runtime
# marker, Podman overlay). The role does not repeat any of it. Two
# implementations of the same host changes drift, and the get.sh one is the
# one tested against the bundle.
#
# What stays here is cheap, read-only, and fails before anything is
# downloaded, with an Ansible error instead of a get.sh die() hidden behind
# no_log: systemd as PID 1, cgroup v2, unprivileged user namespaces, and
# runuser. Firewall ports are opened in firewall.yml for both runtimes.

- name: Assert systemd is the service manager (user units and linger)
  ansible.builtin.assert:
    that:
      - ansible_service_mgr == 'systemd'
    fail_msg: >-
      olakai_runtime: podman-rootless needs systemd (user-scope Podman units
      and loginctl linger keep the stack alive with no login). This host
      reports '{{ ansible_service_mgr }}'. Use olakai_runtime: docker here.

- name: Read the cgroup filesystem type
  ansible.builtin.command:
    cmd: stat -fc %T /sys/fs/cgroup
  register: olakai_cgroup_fs
  changed_when: false
  failed_when: false

- name: Assert the host runs cgroup v2 (unified hierarchy)
  ansible.builtin.assert:
    that:
      - olakai_cgroup_fs.rc == 0
      - olakai_cgroup_fs.stdout | trim == 'cgroup2fs'
    fail_msg: >-
      olakai_runtime: podman-rootless needs cgroup v2. /sys/fs/cgroup is
      '{{ olakai_cgroup_fs.stdout | default('') | trim | default('absent', true) }}'.
      Boot with systemd.unified_cgroup_hierarchy=1 (default on RHEL 9,
      Oracle Linux 9 and Ubuntu 22.04 or newer) or use olakai_runtime: docker.

- name: Read the user namespace limit
  ansible.builtin.slurp:
    src: /proc/sys/user/max_user_namespaces
  register: olakai_max_userns
  failed_when: false

- name: Assert unprivileged user namespaces are enabled
  ansible.builtin.assert:
    that:
      - olakai_max_userns.content is defined
      - (olakai_max_userns.content | b64decode | trim) is match('^[0-9]+$')
      - (olakai_max_userns.content | b64decode | trim) | int > 0
    fail_msg: >-
      olakai_runtime: podman-rootless needs unprivileged user namespaces
      (they map in-container root to the service user).
      /proc/sys/user/max_user_namespaces is
      '{{ (olakai_max_userns.content | default('') | b64decode | trim) | default('absent', true) }}'
      (need > 0). Set user.max_user_namespaces with sysctl or use
      olakai_runtime: docker.

# util-linux installs runuser in /usr/sbin on the RHEL family and in
# /usr/sbin (with a /usr/bin symlink on merged-usr) on Debian and Ubuntu;
# either location satisfies get.sh, which looks it up with `command -v`.
- name: Check for runuser (get.sh hands the bundle to the service user with it)
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/sbin/runuser
    - /usr/bin/runuser
  register: olakai_runuser_stat

- name: Assert runuser is present
  ansible.builtin.assert:
    that:
      - olakai_runuser_stat.results | map(attribute='stat.exists') | select | list | length > 0
    fail_msg: >-
      runuser not found in /usr/sbin or /usr/bin. get.sh runs the bundle as
      {{ olakai_service_user }} with runuser (package util-linux). Install it
      and re-run, or use olakai_runtime: docker.

- name: Note the validation status of this distribution
  ansible.builtin.debug:
    msg: >-
      Rootless Podman is validated on Oracle Linux 9.8 (Podman 5.8.2). Other
      RHEL 9 family distributions ship the same Podman 5 and are accepted, not
      validated. Debian and Ubuntu are not validated: get.sh installs Podman
      from the distro repository only when it offers Podman 5 or newer
      (Ubuntu 24.04 ships 4.9 and is refused), and prints a warning.
      This host: {{ ansible_distribution }} {{ ansible_distribution_version }}.
  when: ansible_distribution != 'OracleLinux'
