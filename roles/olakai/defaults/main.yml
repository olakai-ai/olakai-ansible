---
# Defaults for the olakai role. Override them in group_vars/olakai.yml.
# Every variable is documented here. The playbooks set olakai_action.

# What to do: "install" (fresh install via get.sh) or "upgrade" (upgrade.sh).
olakai_action: install

# Required. Public DNS name that resolves to the host. Becomes the app URL and
# AUTH_URL. Maps to get.sh --domain=.
olakai_domain: ""

# Required. First admin user. Receives the magic-link login e-mail.
# Maps to get.sh --admin-email=.
olakai_admin_email: ""

# Required for install. Single-use license key from Olakai sales. Store it in
# Ansible Vault. The role passes it to get.sh through the OLAKAI_LICENSE_KEY
# environment variable (never on the command line) and runs that task with
# no_log so it is never written to Ansible output or logs.
olakai_license_key: ""

# Where the bundle is extracted. Maps to get.sh --install-dir= and
# upgrade.sh --install-dir=.
olakai_install_dir: /opt/olakai-onprem

# Install only. Print the fallback setup URL in the play output. The URL
# carries a one-time admin bootstrap token (the same login the magic-link
# e-mail gives), and Ansible or AWX job logs are retained and often readable
# by more people than the operator. The role always writes the URL to
# <olakai_install_dir>/.olakai-setup-url (mode 0600, owner root, or the
# service user under podman-rootless) and prints only that path. Set this to
# true to also print the URL, with a warning, when no one else can read the
# job log.
olakai_print_setup_url: false

# Bundle version. Empty = latest servable release.
# install: passes --version=<value> to get.sh when set.
# upgrade: passes --to=<value> to upgrade.sh, or --to=latest when empty.
# podman-rootless needs bundle 1.5.10 or later; the preflight refuses an
# older pin before the license key is consumed.
olakai_version: ""

# Container runtime: "auto", "docker" or "podman-rootless".
# install: auto resolves to docker on every family (Debian, RedHat, Amazon
#   Linux). podman-rootless is explicit opt-in and maps to
#   get.sh --runtime=podman-rootless --service-user=<olakai_service_user>;
#   get.sh prepares the host and runs the bundle as the service user.
# upgrade: auto follows the <olakai_install_dir>/.olakai-runtime marker that
#   get.sh wrote, so the runtime does not have to be repeated. An explicit
#   value must match the marker.
# See README "Runtime choice".
olakai_runtime: auto

# podman-rootless only. Unprivileged user that owns the Podman storage and
# the install directory. Maps to get.sh --service-user=; get.sh creates it
# when missing (useradd -r -m) and assigns a free subordinate id range.
# upgrade.yml runs upgrade.sh as this user. A re-run must name the same
# user; get.sh refuses to move a deployment between users.
olakai_service_user: olakai

# Skip Caddy and Let's Encrypt. Use when TLS terminates upstream.
# Maps to get.sh --no-tls.
olakai_no_tls: false

# Skip ALL cosign verification (bundle and images). Air-gapped escape hatch
# only. Maps to get.sh --skip-verify and upgrade.sh --skip-verify.
olakai_skip_verify: false

# Also verify each container image with cosign at install (strict mode).
# Maps to get.sh --verify-images.
olakai_verify_images: false

# Path on the host to an offline cosign bundle for verification.
# Empty = online Rekor. Maps to get.sh --rekor-bundle=.
olakai_rekor_bundle: ""

# Proceed when the install directory is not empty (existing .env is kept).
# Maps to get.sh --force-overlay. Needs get.sh >= 2026.09.03 (see README
# "Installer compatibility"). The role does not run get.sh at all when
# <olakai_install_dir>/.env already exists, so this only matters for a
# directory that has files but no .env.
olakai_force_overlay: false

# Upgrade only. Accept a release that applies a destructive migration.
# Maps to upgrade.sh --accept-data-loss. upgrade.sh refuses such a release
# without it, on purpose, even with --yes.
olakai_accept_data_loss: false

# Open TCP 80 and 443 in firewalld (RedHat family) or ufw (Debian family) when
# one of them is installed. Set to false if you manage the host firewall
# elsewhere. Cloud security groups are always your job. Applies to both
# runtimes: under podman-rootless get.sh sets
# net.ipv4.ip_unprivileged_port_start=80 so the service user can bind 80 and
# 443, and the host firewall still has to let the traffic in.
olakai_manage_firewall: true

# Install only. .env values merged in before the first bring-up, for
# managed-state deployments (customer-managed PostgreSQL, Redis, object
# storage). Maps to get.sh --env-file= (get.sh 2026.09.04 or later): the
# role writes the dict as KEY=VALUE lines to a root-owned 0600 temporary
# file next to get.sh, with no_log, and removes it after the run. Keys are
# upper-case identifiers, values are written verbatim on one line. The keys
# get.sh writes itself are refused (see olakai_env_keys_owned_by_get_sh in
# vars/main.yml). Keep credentials in Ansible Vault. Example:
#   olakai_env_overrides:
#     DATABASE_URL: "postgresql://olakai:PASSWORD@db.example.com:5432/olakai?sslmode=verify-full"
#     REDIS_URL: "rediss://:PASSWORD@cache.example.com:6380"
#     OBJECT_STORAGE_KIND: s3
#     OBJECT_STORAGE_ENDPOINT: https://s3.us-east-1.amazonaws.com
#     OBJECT_STORAGE_REGION: us-east-1
#     OBJECT_STORAGE_BUCKET: customer-olakai-documents
#     OBJECT_STORAGE_ACCESS_KEY: AKIA...
#     OBJECT_STORAGE_SECRET_KEY: "..."
# See README "Managed state".
olakai_env_overrides: {}

# Install only. Private CA for a managed PostgreSQL or Redis whose server
# certificate is not signed by a public CA (corporate CAs, Amazon RDS
# rds-ca-*). PEM text, one or more CERTIFICATE blocks. Maps to get.sh
# --private-ca= (get.sh 2026.09.04 or later): get.sh copies it to
# <olakai_install_dir>/certs/private-ca.pem and activates the private-CA
# compose overlay. Set this or olakai_private_ca_file, not both.
olakai_private_ca_pem: ""

# Install only. Same as olakai_private_ca_pem, read from a PEM file on the
# control node (not on the target). Example: files/rds-ca.pem.
olakai_private_ca_file: ""

# Where to download the installer from. The role needs get.sh 2026.09.03 or
# later; 2026.09.03.2 or later for podman-rootless; 2026.09.04 or later for
# olakai_env_overrides and the private CA (see README "Installer
# compatibility"). Point this at a pre-release copy served over HTTPS (or a
# file:// path on the target) to review the role before get.olakai.ai serves
# that version.
olakai_get_sh_url: https://get.olakai.ai/get.sh

# SHA256 of get.sh. Empty = do not pin. get.sh is fetched over HTTPS and is
# not itself signed (the bundle it downloads is cosign-verified). Pinning is
# recommended: put the checksum of the reviewed get.sh here and the download
# fails on any mismatch.
olakai_get_sh_sha256: ""

# Docker runtime only. Install Docker Engine with the get.docker.com script
# when the docker binary is missing (Amazon Linux uses the distro package;
# Oracle Linux is left to get.sh, which installs from Docker's CentOS
# package repository because get.docker.com rejects ID=ol). The upstream
# get.docker.com script is not signature-verified. The conservative option
# is false: the role then fails early with manual-install instructions, and
# you install Docker Engine 24+ with Compose v2 from Docker's signed package
# repositories first. When true the role also passes --auto-install-docker
# to get.sh as a fallback. Ignored under podman-rootless: get.sh installs
# Podman from the distro's signed repositories there.
olakai_auto_install_docker: true

# Extra arguments appended to the get.sh command line. Use it for flags this
# role version does not know yet, for example ["--quiet"].
olakai_get_sh_extra_args: []

# Extra arguments appended to the upgrade.sh command line.
olakai_upgrade_sh_extra_args: []
