---
galaxy_info:
  role_name: olakai
  namespace: olakai
  author: Olakai
  description: Install and upgrade Olakai on-prem by wrapping get.sh and upgrade.sh
  company: Olakai, Inc.
  license: Apache-2.0
  min_ansible_version: "2.15"
  # Target hosts accepted by the installer (get.sh detect_os). This list is
  # not a support statement. Refer to Olakai's platform support documentation
  # for the qualified list.
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble
    - name: Debian
      versions:
        - bookworm
    - name: EL
      versions:
        - "9"
  galaxy_tags:
    - olakai
    - onprem
    - docker
    - podman

dependencies: []
