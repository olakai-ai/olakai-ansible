---
# Role-internal constants. Not meant to be overridden by users.

# Distros the role's preflight accepts, keyed by ansible_distribution, with
# the minimum major version. Ubuntu is checked against 22.04 in preflight.yml
# because its versions carry a meaningful minor. This list mirrors detect_os
# in get.sh (what the installer accepts); it is not a support statement.
# Refer to Olakai's platform support documentation for the qualified list.
olakai_accepted_distros:
  Ubuntu: "22.04"
  Debian: "12"
  RedHat: "9"
  Rocky: "9"
  AlmaLinux: "9"
  CentOS: "9"
  OracleLinux: "9"
  Amazon: "2023"

# Human-readable copy of the list for error messages.
olakai_accepted_distros_human: >-
  Ubuntu 22.04+, Debian 12+, RHEL 9+ (Rocky and AlmaLinux 9+),
  Oracle Linux 9+, Amazon Linux 2023

# Minimum usable RAM in MB. Cloud VMs advertised as 8 GB report about
# 7500-7700 MB in MemTotal after the kernel reservation. get.sh checks 7500;
# the role checks a little lower so it never rejects a VM get.sh accepts.
olakai_min_memtotal_mb: 7000

# Oldest bundle that runs under rootless Podman. get.sh enforces the same
# floor, but only after the license handshake has consumed the key; the
# role's preflight checks a pinned olakai_version before that.
olakai_rootless_min_bundle_version: "1.5.10"

# .env keys get.sh writes itself (materialize_env). get.sh --env-file
# refuses them; the preflight refuses them first. Everything else
# (DATABASE_URL, REDIS_URL, OBJECT_STORAGE_*, ...) may be overridden.
olakai_env_keys_owned_by_get_sh:
  - NEXTAUTH_SECRET
  - AUTH_SECRET
  - DEFAULT_ENCRYPTION_KEY
  - NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
  - ENCRYPTION_SALT
  - POSTGRES_PASSWORD
  - MINIO_ROOT_PASSWORD
  - REDIS_PASSWORD
  - OLAKAI_SUPPORT_BUNDLE_SECRET
  - OLAKAI_DOMAIN
  - AUTH_URL
  - OLAKAI_ADMIN_EMAIL
  - OLAKAI_EMAIL_RELAY_KEY
  - OLAKAI_VERSION

# Standalone Docker Compose v2 binary for Amazon Linux under the docker
# runtime (no compose plugin in the distro repos). Pinned by version and
# SHA256. Under podman-rootless, get.sh installs its own pinned copy at
# /usr/local/bin/docker-compose and registers it as the Podman compose
# provider; the role does not touch it.
# Source: https://github.com/docker/compose/releases/tag/v5.5.1
# Checksums fetched 2026-09-03 from the release's
# docker-compose-linux-<arch>.sha256 assets.
olakai_compose_version: v5.5.1
olakai_compose_sha256:
  x86_64: db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576
  aarch64: 732e3a84c1a0f67256ce80bc2598a24546b10ca05f9faa97efceb1171ece2ef7
olakai_compose_url: >-
  https://github.com/docker/compose/releases/download/{{ olakai_compose_version }}/docker-compose-linux-{{ ansible_architecture }}
olakai_compose_plugin_path: /usr/local/lib/docker/cli-plugins/docker-compose

# Where install.yml stores the one-time setup URL get.sh printed (mode 0600).
# Kept next to .env so it shares the install directory's ownership and is
# gone with the directory on uninstall. See olakai_print_setup_url.
olakai_setup_url_path: "{{ olakai_install_dir }}/.olakai-setup-url"

# Ports Caddy needs.
olakai_firewall_ports:
  - 80
  - 443
